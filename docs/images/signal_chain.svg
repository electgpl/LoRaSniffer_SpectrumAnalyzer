<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e8e9a"/>
    </marker>
  </defs>
  <rect width="980" height="300" rx="10" fill="#111217"/>

  <!-- SX1262 group -->
  <rect x="20" y="40" width="520" height="160" rx="8" fill="none" stroke="#5794f2" stroke-dasharray="5 4"/>
  <text x="32" y="32" fill="#5794f2" font-size="13">SX1262 (GFSK RX, continuous)</text>

  <g font-size="13" text-anchor="middle">
    <rect x="35" y="90" width="90" height="56" rx="6" fill="#181b1f" stroke="#2c3235"/>
    <text x="80" y="114" fill="#ccccdc">LNA</text>
    <text x="80" y="132" fill="#8e8e9a" font-size="11">boosted gain</text>

    <rect x="150" y="90" width="90" height="56" rx="6" fill="#181b1f" stroke="#2c3235"/>
    <text x="195" y="114" fill="#ccccdc">Mixer</text>
    <text x="195" y="132" fill="#8e8e9a" font-size="11">low IF</text>

    <rect x="150" y="160" width="90" height="32" rx="6" fill="#181b1f" stroke="#2c3235"/>
    <text x="195" y="181" fill="#fade2a" font-size="11">PLL f(i)</text>

    <rect x="265" y="90" width="110" height="56" rx="6" fill="#181b1f" stroke="#2c3235"/>
    <text x="320" y="114" fill="#ccccdc">Channel filter</text>
    <text x="320" y="132" fill="#fade2a" font-size="11">RxBw = RBW</text>

    <rect x="400" y="90" width="120" height="56" rx="6" fill="#181b1f" stroke="#2c3235"/>
    <text x="460" y="114" fill="#ccccdc">RssiInst</text>
    <text x="460" y="132" fill="#8e8e9a" font-size="11">-RssiInst/2 dBm</text>

    <rect x="580" y="90" width="170" height="56" rx="6" fill="#181b1f" stroke="#73bf69"/>
    <text x="665" y="112" fill="#ccccdc">ESP32-S3</text>
    <text x="665" y="130" fill="#8e8e9a" font-size="11">N reads: peak + lin. avg</text>

    <rect x="790" y="90" width="170" height="56" rx="6" fill="#181b1f" stroke="#c792ea"/>
    <text x="875" y="112" fill="#ccccdc">Python dashboard</text>
    <text x="875" y="130" fill="#8e8e9a" font-size="11">trace · max · avg · waterfall</text>
  </g>

  <g stroke="#8e8e9a" stroke-width="1.5" marker-end="url(#a)">
    <line x1="125" y1="118" x2="148" y2="118"/>
    <line x1="240" y1="118" x2="263" y2="118"/>
    <line x1="375" y1="118" x2="398" y2="118"/>
    <line x1="520" y1="118" x2="578" y2="118"/>
    <line x1="750" y1="118" x2="788" y2="118"/>
    <line x1="195" y1="160" x2="195" y2="148"/>
  </g>
  <text x="549" y="108" fill="#8e8e9a" font-size="11" text-anchor="middle">SPI</text>
  <text x="769" y="108" fill="#8e8e9a" font-size="11" text-anchor="middle">USB</text>
  <text x="80" y="68" fill="#8e8e9a" font-size="11" text-anchor="middle">RF in</text>
  <line x1="80" y1="73" x2="80" y2="88" stroke="#8e8e9a" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="20" y="240" fill="#ccccdc" font-size="13">Per point i:  SetStandby(XOSC) → SetRfFrequency(f0 + i·step) → SetRx(continuous) → settle → N × GetRssiInst</text>
  <text x="20" y="266" fill="#8e8e9a" font-size="12">One JSON line per sweep: pk / av as hex bytes, value = −2·P[dBm] (0.5 dB resolution, native RssiInst format)</text>
</svg>
